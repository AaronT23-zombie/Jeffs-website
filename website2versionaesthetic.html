<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Measure Leadership and Development</title>
    <style>
        /* Base styles and clean modern typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background-color: #ffffff;
            line-height: 1.6;
        }

        /* Hero Header Section */
        .hero {
            position: relative;
            background: linear-gradient(rgba(15, 34, 64, 0.6), rgba(15, 34, 64, 0.6)), 
                        url('statue-placeholder.jpg') center/cover no-repeat;
            color: #ffffff;
            text-align: center;
            padding: 100px 20px;
        }
        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .hero p {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Keynote Single Hour Ribbon */
        .ribbon {
            background-color: #dce7f3;
            color: #0f2240;
            text-align: center;
            padding: 20px 10px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 2px solid #b0c4de;
        }

        /* Navigation Links Bar */
        .nav-bar {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 25px 10px;
            gap: 15px;
        }
        .nav-link {
            background-color: #2b70c9;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 12px 35px;
            border-radius: 4px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            min-width: 160px;
            text-align: center;
        }
        .nav-link:hover {
            background-color: #1a529b;
        }
        .nav-link:active {
            transform: scale(0.98);
        }

        /* Team Gallery Section */
        .team-section {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 50px;
        }
        .team-member {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .team-member img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #ccc; /* fallback placeholder color */
        }

        /* Footer Info Section */
        .footer-info {
            margin-top: 40px;
            padding: 40px 20px;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        .footer-info h2 {
            font-size: 2.2rem;
            color: #0f2240;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .footer-info p {
            font-size: 1.1rem;
            color: #555;
            text-transform: uppercase;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header class="hero">
        <h1>Full Measure</h1>
        <p>Leadership and Development</p>
    </header>

    <!-- Keynote Training Offerings Ribbon -->
    <div class="ribbon">
        Keynote Single Hour to Full Week Training Offerings
    </div>

    <!-- Clean Button Navigation Section -->
    <nav class="nav-bar">
        <a href="#leadership" class="nav-link">Leadership</a>
        <a href="#keynotes" class="nav-link">Keynotes</a>
        <a href="#gallery" class="nav-link">Gallery</a>
        <a href="#testimonials" class="nav-link">Testimonials</a>
        <a href="#official-flyer" class="nav-link">Official Flyer</a>
    </nav>

    <!-- Clean Team Grid Section -->
    <main class="team-section">
        <div class="team-grid">
            <!-- Row 1 Placeholder Grid Items -->
            <div class="team-member"><img src="headshot1.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot2.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot3.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot4.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot5.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot6.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot7.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot8.jpg" alt="Team Member"></div>
            
            <!-- Row 2 Placeholder Grid Items -->
            <div class="team-member"><img src="headshot9.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot10.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot11.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot12.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot13.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot14.jpg" alt="Team Member"></div>
            <div class="team-member"><img src="headshot15.jpg" alt="Team Member"></div>
        </div>
       
    </main>

</body>
</html>
